version: 2
source_of_truth: .ai/test-matrix.yaml
default_environment: local_isolated_no_external_export
status_values: [PASS, FAIL, NOT_RUN]
checks:
  focused_tests: {description: Focused behavior and failure-path tests}
  full_pytest: {command: python -m pytest -q}
  quality: {command: nox -s lint format_check types}
  diff_check: {command: git diff --check}
  security: {command: nox -s security}
  dependency_audit: {command: nox -s deps_audit}
  compose_config: {description: Render the exact selected Compose overlays and profiles}
  schema_validation: {description: Validate versioned schemas}
  serialization_round_trip: {description: Round-trip old and current serialized artifacts}
  fixture_replay: {description: Replay old and current fixtures through real boundaries}
  named_consumers: {description: Exercise every named producer and consumer}
  edge_failure_paths: {description: Exercise disconnect, timeout, reconnect, and fake-device paths}
  deterministic_simulation: {description: Replay deterministic control and safety scenarios}
  model_failure_paths: {description: Exercise malformed, extra, timeout, unavailable, bounded, and privacy cases}
  changed_links_paths_commands: {description: Verify changed documentation references and commands}
  feature_planner_evaluation: {command: python -m tools.evaluate_feature_planner}
  reviewer_evaluation: {command: python -m tools.evaluate_reviewer}
classes:
  pure_software:
    required: [focused_tests, full_pytest, quality, diff_check]
  schema_data_contract:
    required: [full_pytest, quality, diff_check, schema_validation, serialization_round_trip, fixture_replay, named_consumers]
  infrastructure_deployment:
    required: [full_pytest, quality, diff_check, compose_config]
  edge_hardware_integration:
    required: [full_pytest, quality, diff_check, fixture_replay, edge_failure_paths]
  control_guardrails_executor:
    required: [full_pytest, quality, diff_check, deterministic_simulation]
  llm_vision:
    required: [full_pytest, quality, diff_check, model_failure_paths]
  documentation_only:
    required: [diff_check, changed_links_paths_commands]
risk_flags:
  physical_action:
    add: [deterministic_simulation]
    manual: [supervised_safe_hardware_and_rollback]
  data_loss_migration:
    add: [fixture_replay]
    manual: [isolated_upgrade_restore_counts_hashes_backup_rollback]
  security_secrets:
    add: [security, dependency_audit]
  edge_server_compatibility:
    add: [fixture_replay, named_consumers]
    manual: [edge_canary]
  production_availability:
    add: [compose_config]
    manual: [isolated_rehearsal_rollback_post_deploy_health]
  public_contract:
    add: [schema_validation, serialization_round_trip, fixture_replay, named_consumers]

historical_examples:
  - reference: "1a9aeeb (#68)"
    description: "State Estimator layer normalizes telemetry and publishes derived canonical state without actuation."
    task_classes: [pure_software, schema_data_contract, edge_hardware_integration]
    risk_flags: [edge_server_compatibility, public_contract]
  - reference: "6398d9e (#74)"
    description: "Read-only action simulation adds deterministic Guardrails reporting and explicitly keeps physical actuation disabled."
    task_classes: [pure_software, control_guardrails_executor]
    risk_flags: [physical_action]
  - reference: "a480b9f (#64)"
    description: "Active server contracts make versioned schemas, fixtures, and operational boundaries explicit."
    task_classes: [schema_data_contract]
    risk_flags: [edge_server_compatibility, public_contract]
  - reference: "5e6f654"
    description: "VPD telemetry metrics add unit-bearing derived fields and preserve the telemetry contract for consumers."
    task_classes: [schema_data_contract]
    risk_flags: [public_contract, edge_server_compatibility]
  - reference: "aa91ba1"
    description: "Provisioned Grafana dashboards consume persisted telemetry through the read-only observability boundary."
    task_classes: [schema_data_contract, infrastructure_deployment]
    risk_flags: [public_contract, production_availability]
  - reference: "8b3ef35 (#111)"
    description: "Ollama daily story remains an optional bounded analyst and communication consumer without ingestion or actuation authority."
    task_classes: [llm_vision]
    risk_flags: []
  - reference: "bc16f24 (#114)"
    description: "Secure multi-app production layout separates the application lifecycle from shared platform services."
    task_classes: [infrastructure_deployment]
    risk_flags: [security_secrets, production_availability]
  - reference: "532c53b (#120)"
    description: "Migration and restore hardening enforces checksums, readiness, isolated targets, and shared-service boundaries."
    task_classes: [schema_data_contract, infrastructure_deployment]
    risk_flags: [data_loss_migration, production_availability]
