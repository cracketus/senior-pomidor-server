      <text x="18" y="83" fill="#ffb357" font-size="30" font-weight="700">RECOVERING</text>
      <text x="18" y="108" fill="#8e9aa5" font-size="13">suppression: off</text>
    </g>
    <g transform="translate(730 102)">
      <rect width="330" height="125" rx="6" fill="#181b1f" stroke="#2b3138"/>
      <text x="18" y="28" fill="#c7d0d9" font-size="14">Spool</text>
