<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized synthetic Senior Pomidor Edge Reliability dashboard</title>
  <desc id="desc">Synthetic Grafana-style dashboard for demo-edge-01 with current state, freshness, counters, storage pressure, and timelines.</desc>
  <rect width="1440" height="810" fill="#111217"/>
  <rect x="0" y="0" width="1440" height="58" fill="#181b1f"/>
  <text x="28" y="37" fill="#f4f5f5" font-family="Arial, sans-serif" font-size="24" font-weight="700">Senior Pomidor Edge Reliability</text>
  <rect x="1150" y="13" width="250" height="34" rx="4" fill="#24292e" stroke="#3d444d"/>
  <text x="1170" y="35" fill="#c7d0d9" font-family="Arial, sans-serif" font-size="15">Device: demo-edge-01</text>
      <text x="28" y="82" fill="#8e9aa5" font-family="Arial, sans-serif" font-size="13">SANITIZED SYNTHETIC DATA - RELATIVE TIME ONLY</text>

  <g font-family="Arial, sans-serif">
