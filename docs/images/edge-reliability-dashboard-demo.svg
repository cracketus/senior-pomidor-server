      <text x="435" y="55" fill="#c7d0d9" font-size="14">restart  2</text>
      <text x="545" y="55" fill="#c7d0d9" font-size="14">reboot  0</text>
    </g>
    <g transform="translate(730 248)">
      <rect width="682" height="232" rx="6" fill="#181b1f" stroke="#2b3138"/>
      <text x="18" y="30" fill="#c7d0d9" font-size="15">Backlog and storage pressure</text>
      <text x="28" y="83" fill="#f4f5f5" font-size="28" font-weight="700">24</text>
      <text x="28" y="106" fill="#8e9aa5" font-size="13">pending records</text>
      <text x="215" y="83" fill="#f4f5f5" font-size="28" font-weight="700">18 min</text>
      <text x="215" y="106" fill="#8e9aa5" font-size="13">oldest pending</text>
