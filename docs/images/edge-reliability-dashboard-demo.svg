      <rect x="28" y="150" width="610" height="18" rx="9" fill="#24292e"/>
      <rect x="28" y="150" width="189" height="18" rx="9" fill="#73bf69"/>
      <text x="28" y="197" fill="#8e9aa5" font-size="13">database and free-space gauges shown without paths</text>
    </g>

    <g transform="translate(28 501)">
      <rect width="1384" height="272" rx="6" fill="#181b1f" stroke="#2b3138"/>
      <text x="18" y="31" fill="#c7d0d9" font-size="15">Recovery and degradation state timeline</text>
      <text x="18" y="88" fill="#8e9aa5" font-size="14">watchdog</text>
      <rect x="125" y="58" width="310" height="42" fill="#73bf69"/>
      <rect x="435" y="58" width="250" height="42" fill="#ffb357"/>
      <rect x="685" y="58" width="671" height="42" fill="#73bf69"/>
      <text x="245" y="84" fill="#111217" font-size="13" font-weight="700">healthy</text>
      <text x="520" y="84" fill="#111217" font-size="13" font-weight="700">recovering</text>
      <text x="980" y="84" fill="#111217" font-size="13" font-weight="700">healthy</text>
      <text x="18" y="160" fill="#8e9aa5" font-size="14">spool</text>
      <rect x="125" y="130" width="420" height="42" fill="#73bf69"/>
      <rect x="545" y="130" width="430" height="42" fill="#ffb357"/>
      <rect x="975" y="130" width="381" height="42" fill="#73bf69"/>
      <text x="315" y="156" fill="#111217" font-size="13" font-weight="700">OK</text>
      <text x="725" y="156" fill="#111217" font-size="13" font-weight="700">BACKLOG</text>
      <text x="1140" y="156" fill="#111217" font-size="13" font-weight="700">OK</text>
      <text x="125" y="225" fill="#8e9aa5" font-size="13">now - 24h</text>
      <text x="1315" y="225" fill="#8e9aa5" font-size="13">now</text>
