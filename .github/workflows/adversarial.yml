name: Bounded adversarial verification
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 2'
  pull_request:
    paths:
      - tools/mutation_check.py
      - tests/test_openapi_fuzz.py
      - .github/workflows/adversarial.yml
permissions:
  contents: read
jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Run bounded mutation catalogue
        run: python -m tools.mutation_check --output verification-artifacts/mutation.json
      - name: Retain results including survivors
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-${{ github.sha }}
          path: verification-artifacts/mutation.json
          if-no-files-found: error
          retention-days: 30
