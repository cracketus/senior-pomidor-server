name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: nox -s tests

      - name: Validate self-contained local Compose configuration
        env:
          APP_IMAGE: senior-pomidor-server:ci
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile observability --profile daily-story config --quiet

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run quality checks
        run: nox -s lint format_check types

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Python security checks
        run: nox -s security deps_audit

      - name: Build Docker image
        run: docker build -t senior-pomidor-server:ci .

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "senior-pomidor-server:ci"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_DOCKER_E2E: "1"
      SENIOR_POMIDOR_E2E_PROJECT: senior-pomidor-server-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out exact candidate tree
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run isolated Docker Compose E2E
        run: python -m pytest -q tests/test_docker_e2e.py -p no:cacheprovider

  core-release-candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, quality, security, docker-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/cracketus/senior-pomidor-server
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact candidate tree
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish SHA-only Core release candidate
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.COMMIT_SHA }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
            org.opencontainers.image.version=${{ env.COMMIT_SHA }}
      - name: Verify candidate identity and platforms
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          raw="$(docker buildx imagetools inspect "$IMAGE:$COMMIT_SHA" --raw)"
          jq -e '([.manifests[] | select(.platform.architecture == "amd64" and .platform.os == "linux")] | length) == 1 and ([.manifests[] | select(.platform.architecture == "arm64" and .platform.os == "linux")] | length) == 1' <<<"$raw" >/dev/null
      - name: Write Core release-candidate metadata
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p qualification-artifacts
          jq -n --arg sha "$COMMIT_SHA" --arg digest "$DIGEST" \
            --arg image "$IMAGE@$DIGEST" --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            '{schema_version:"senior-pomidor.core.release-candidate.v1", git_sha:$sha, image_ref:$image, image_digest:$digest, platforms:["linux/amd64","linux/arm64"], workflow_ref:$workflow_ref}' \
            > qualification-artifacts/senior-pomidor.core.release-candidate.v1.json
      - name: Upload Core release-candidate metadata
        uses: actions/upload-artifact@v7
        with:
          name: senior-pomidor.core.release-candidate.v1
          path: qualification-artifacts/senior-pomidor.core.release-candidate.v1.json
          if-no-files-found: error
          retention-days: 30
